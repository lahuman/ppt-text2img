name: Checks

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test
        env:
          RUN_UI_TESTS: '1'
          RUN_POWERPOINT_TESTS: '0'
        run: |
          $testLog = Join-Path $env:RUNNER_TEMP 'unittest.log'
          python -B -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath $testLog
          if ($LASTEXITCODE -ne 0) {
            $failures = Select-String -Path $testLog -Pattern '^(FAIL|ERROR): |^[\w.]+(Error|Exception): '
            foreach ($failure in $failures) {
              $message = $failure.Line.Replace('%', '%25')
              Write-Output "::error::$message"
            }
            exit 1
          }
          node --check docs/site.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
